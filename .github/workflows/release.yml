name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check if stable release
        id: check
        run: |
          # align with build-docker.yml: stable only for strict semver tags
          if [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "stable=true" >> "$GITHUB_OUTPUT"
          else
            echo "stable=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract changelog
        id: changelog
        run: |
          tag="$GITHUB_REF_NAME"
          body=$(sed -n "/^\# .*\[${tag}\]/,/^\# .*\[v/{/^\# .*\[v/!p}" CHANGELOG.md || true)
          cat >> "$GITHUB_OUTPUT" <<DELIM
          body<<EOF
          ${body}

          **Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/blob/${tag}/CHANGELOG.md
          EOF
          DELIM

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BODY: ${{ steps.changelog.outputs.body }}
          STABLE: ${{ steps.check.outputs.stable }}
        run: |
          tag="$GITHUB_REF_NAME"
          if [[ "$STABLE" == "true" ]]; then
            flags=(--prerelease=false --latest)
          else
            flags=(--prerelease --latest=false)
          fi

          # update the release if it already exists for this tag, otherwise create it
          if name=$(gh release view "$tag" --json name,isDraft --jq 'if .isDraft then "" else .name end' 2>/dev/null); then
            # a published release keeps its existing name
            gh release edit "$tag" --title "${name:-$tag}" --notes "$BODY" --draft=false "${flags[@]}"
          else
            gh release create "$tag" --verify-tag --title "$tag" --notes "$BODY" "${flags[@]}"
          fi
